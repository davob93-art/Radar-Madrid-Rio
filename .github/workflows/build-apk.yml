name: Compilar app Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Clave de firma
        env:
          KEYSTORE_B64: ${{ secrets.RADAR_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/radar.jks"
            echo "RADAR_KEYSTORE_PATH=$RUNNER_TEMP/radar.jks" >> "$GITHUB_ENV"
          elif [ -f android/radar.jks ]; then
            echo "RADAR_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/radar.jks" >> "$GITHUB_ENV"
          fi

      - name: Compilar
        env:
          RADAR_KEYSTORE_PASSWORD: ${{ secrets.RADAR_KEYSTORE_PASSWORD || 'radar-madrid-rio' }}
        run: gradle -p android assembleRelease --no-daemon

      - name: Publicar el .apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk RadarMadridRio.apk
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" RadarMadridRio.apk \
            --title "Radar Madrid Río ${TAG}" \
            --notes "Descarga RadarMadridRio.apk desde el móvil Android y ábrelo para instalarlo." \
            --latest
